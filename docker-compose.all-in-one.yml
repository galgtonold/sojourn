# Sojourn plus everything it needs — one command, one host, no accounts.
#
#   docker run --rm ghcr.io/galgtonold/sojourn:latest \
#     node scripts/selfhost-init.mjs --stdout > .env.selfhost
#   docker compose -f docker-compose.all-in-one.yml --env-file .env.selfhost up -d
#
# Any image tag will do for the first command — it mints random keys and reads
# nothing from the version it runs in.
#
# WHICH VERSION YOU ACTUALLY RUN is `SOJOURN_TAG`, below, and it defaults to
# `latest`. Downloading this file from a specific release therefore does NOT
# pin the app to that release: the file is the one that was tested against that
# version, which is not the same promise. To pin, set it —
#
#   SOJOURN_TAG=0.2.0 docker compose -f … up -d
#
# — or put it in .env.selfhost. `0.2`, `0` and `latest` each choose how much
# change you are willing to take unattended.
#
# Use this when you want a blog on your own machine and nothing else to think
# about. Use the plain docker-compose.yml instead when you already have Supabase
# (hosted or your own) — it is one container and runs happily in 1 GB.
#
# ── this file stands alone, deliberately ─────────────────────────────────────
#
# Nothing here is bind-mounted from a checkout. Kong's routing table and the
# Postgres role-password fix used to live in ./docker/ and be mounted in, which
# meant self-hosting began with `git clone` — of a repository whose source you
# do not otherwise need, since the app arrives as a published image. They are
# now `configs:` blocks at the foot of this file, so this ONE file is the whole
# install:
#
#   curl -O -L https://github.com/galgtonold/sojourn/releases/latest/download/docker-compose.all-in-one.yml
#
# From the RELEASE rather than from main, so the file and the image it names are
# the same version. Attached by .github/workflows/publish-image.yml.
#
# (Compose also accepts `-f https://github.com/…/sojourn.git` directly, and
# `-f oci://…` for a file published with `docker compose publish`. Neither is
# used here: the git form resolves the repository's DEFAULT compose file — the
# plain one-container docker-compose.yml — and cannot select this one by name,
# while `publish` rejects the short `ports:` syntax below and demands a value
# for every `${VAR:?}` at publish time, which would mean feeding it secrets to
# describe a stack that has none.)
#
# Requires Compose ≥ 2.23 for `configs.content`. Anything older reports
# "services.db.configs.0 additional property content is not allowed".
#
# ── what is here, and what is deliberately not ───────────────────────────────
#
# Five services, ~800 MB: Postgres, Kong, PostgREST, GoTrue, storage-api. What a
# full Supabase stack also starts, and why Sojourn does not need it:
#
#   realtime   244 MB   nothing subscribes — `.channel(` appears in zero files
#   analytics  647 MB   log aggregation for the Supabase dashboard
#   studio     259 MB   that dashboard. `psql` is enough to look at your data
#   pg_meta    128 MB   an API the dashboard uses to introspect the schema
#   imgproxy            storage-side image transforms; Sojourn resizes with
#                       next/image instead (ENABLE_IMAGE_TRANSFORMATION=false)
#   edge-runtime        Deno, for functions that exist only to dodge Vercel's
#                       request timeout. A host you own has no such timeout, so
#                       that work runs in the app — see src/lib/ai/translate-run
#
# Leaving them out is most of the difference between needing 4 GB and needing 2.
#
# ── the two URLs that actually matter ────────────────────────────────────────
#
# SUPABASE_PUBLIC_URL is handed to the visitor's browser, so it has to be a URL
# their machine can resolve — and the app container has to reach the same one.
# `localhost` satisfies only the first. The default is host.docker.internal for
# local use; on a real host, put your domain or IP there and publish port 8000.

name: sojourn

services:
  db:
    image: public.ecr.aws/supabase/postgres:17.6.1.147
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/selfhost-init.mjs first}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_EXP: 3600
    volumes:
      # Your posts live here. This is the thing to back up — see docs/deployment.md.
      - db-data:/var/lib/postgresql/data
    configs:
      # Runs once, on an empty data directory, and LAST: the image's own
      # migrate.sh is what creates these roles, so anything sorting before it
      # fails with `role "authenticator" does not exist`.
      #
      # A config rather than a volume mount: a named volume mounted over
      # /docker-entrypoint-initdb.d would be seeded from the image only while it
      # is still empty, so writing this file into it first would HIDE the
      # image's own init scripts and the roles would never be created at all.
      # A config is a single-file mount, which shadows nothing.
      - source: db-init-roles
        target: /docker-entrypoint-initdb.d/zz-sojourn-roles.sh
        # Executable on purpose. The Postgres entrypoint runs a .sh file if it
        # can and otherwise `source`s it into its own shell, where this script's
        # `set -euo pipefail` would outlive it. Under the old bind mount that
        # depended on the host's file permissions, so it varied by machine.
        mode: 0555
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published by default: nothing outside this network needs Postgres, and
    # an open 5432 is how self-hosted databases get found. Uncomment to run
    # migrations or take a dump from the host.
    # ports:
    #   - "5432:5432"

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.190.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL}/**
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_AUD: authenticated
      # Sojourn creates its owner through first-run setup and everyone else by
      # invitation. Open signup on a personal journal is only ever a mistake.
      GOTRUE_DISABLE_SIGNUP: "true"
      # No SMTP out of the box, so a new account cannot be asked to confirm by
      # email — it would never arrive and the account would be unusable.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Defence in depth behind Kong's limit. GoTrue has no setting for the
      # password grant — this covers refresh-token grinding only, which is the
      # part it does police.
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "60"

  rest:
    image: public.ecr.aws/supabase/postgrest:v14.13
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  storage:
    image: public.ecr.aws/supabase/storage-api:v1.60.20
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      POSTGREST_URL: http://rest:3000
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      # Off, so no imgproxy container. Sojourn hands photos to next/image, which
      # resizes them in the app.
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      # Your photographs. Back this up alongside the database — a dump without
      # these is an archive of captions.
      - storage-data:/var/lib/storage
    healthcheck:
      # 127.0.0.1, not localhost: storage-api binds IPv4 only, and `localhost`
      # resolves to ::1 first inside this image — so the check is refused while
      # the service is perfectly healthy, and nothing that depends on it starts.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5000/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  kong:
    image: public.ecr.aws/supabase/kong:2.8.1
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - storage
    ports:
      - "${SUPABASE_PORT:-8000}:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,rate-limiting
    configs:
      # Compose substitutes the two keys into the config below as it reads this
      # file, so Kong gets a finished routing table and the image's own
      # entrypoint is left alone.
      #
      # This replaces a template that was mounted in and rendered at start with
      # `eval "echo \"$(cat …)\""`. That worked, but it put a shell eval in the
      # boot path of the component holding the API keys, and it silently ate
      # double quotes — which is why `_format_version` had to be single-quoted
      # or Kong would read 2.1 as a number and refuse to start.
      - source: kong-config
        target: /home/kong/kong.yml
        mode: 0444

  web:
    image: ghcr.io/galgtonold/sojourn:${SOJOURN_TAG:-latest}
    restart: unless-stopped
    depends_on:
      # storage-api creates the `storage` schema by running its own migrations
      # on first boot, and Sojourn's 0001_init writes policies on
      # storage.objects. Start before it is healthy and the very first migration
      # fails with `relation "storage.buckets" does not exist`.
      storage:
        condition: service_healthy
      kong:
        condition: service_started
    ports:
      - "${SOJOURN_PORT:-3000}:3000"
    environment:
      SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_KEY}
      # Direct connection for the migration runner, which speaks SQL rather than
      # going through PostgREST. Never the pooler.
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      SITE_URL: ${SITE_URL}
      SITE_NAME: ${SITE_NAME:-Sojourn}
      SOURCE_URL: ${SOURCE_URL:-}
      MAP_STYLE_URL: ${MAP_STYLE_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    extra_hosts:
      # So SUPABASE_PUBLIC_URL can name one host that both the browser and this
      # container resolve, which is the whole difficulty with a public URL.
      - "host.docker.internal:host-gateway"

volumes:
  db-data:
  storage-data:

# ── the two files this stack used to need a checkout for ─────────────────────
configs:
  # Give the Supabase service roles the password THIS instance uses.
  #
  # The supabase/postgres image creates these roles, but leaves them with
  # whatever password it was built with — so GoTrue and storage-api start and
  # immediately fail with `28P01: password authentication failed`, which reads
  # like this file has the wrong credentials rather than like the roles were
  # never told. Upstream's self-hosted compose does the same thing.
  #
  # Runs only on an empty data directory, which is the one moment these roles
  # are guaranteed to exist and nothing has tried to connect yet. Changing
  # POSTGRES_PASSWORD later means running these ALTERs by hand.
  db-init-roles:
    content: |
      #!/bin/bash
      set -euo pipefail

      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<-EOSQL
        alter user authenticator          with password '$$POSTGRES_PASSWORD';
        alter user supabase_auth_admin    with password '$$POSTGRES_PASSWORD';
        alter user supabase_storage_admin with password '$$POSTGRES_PASSWORD';
        alter user supabase_admin         with password '$$POSTGRES_PASSWORD';
      EOSQL

      echo "sojourn: service role passwords set"

  # Kong routes one public URL onto the three Supabase services Sojourn uses.
  # Trimmed from Supabase's own self-hosted config: no realtime, no analytics,
  # no studio, no edge functions — see the top of this file for why each is
  # absent.
  #
  # `$${...}` is a literal dollar for Postgres above; the two `${...}` below are
  # substituted by Compose from --env-file, which is how the keys stay out of
  # git while this file carries the config.
  kong-config:
    content: |
      # Single-quoted on purpose: YAML would otherwise read 2.1 as a number, and
      # Kong refuses to start with "expected a string".
      _format_version: '2.1'
      _transform: true

      consumers:
        - username: anon
          keyauth_credentials:
            - key: ${SUPABASE_ANON_KEY:?run selfhost-init first}
        - username: service_role
          keyauth_credentials:
            - key: ${SUPABASE_SERVICE_KEY:?}

      acls:
        - consumer: anon
          group: anon
        - consumer: service_role
          group: admin

      services:
        # THE PASSWORD GRANT, and only it. Signing in cannot require a key you
        # only get by signing in, so nothing under /auth/v1/ has key-auth —
        # which makes this the one route where guessing is free. GoTrue
        # v2.190.0 ships rate limits for token REFRESH, OTP, verify, email and
        # SMS, and nothing at all for the password grant. So the ceiling is
        # Kong's to enforce, and it belongs HERE rather than on all of
        # /auth/v1/ — see the note on the general route below for what that
        # cost when it did.
        #
        # `strip_path: true` removes the matched prefix, so the service URL
        # carries /token; without it GoTrue receives / and answers 404.
        - name: auth-v1-token
          url: http://auth:9999/token
          routes:
            - name: auth-v1-token
              strip_path: true
              paths:
                - /auth/v1/token
          plugins:
            - name: cors
            - name: rate-limiting
              config:
                # Generous for a person signing in, useless for a script.
                minute: 30
                hour: 200
                # `local` keeps the counters in this Kong's own memory. Correct
                # here because the all-in-one runs exactly one Kong; a clustered
                # deployment would need the redis policy and a redis for it.
                policy: local
                limit_by: ip
                # Refuse rather than let it through when the counter breaks.
                fault_tolerant: false
                # NOTE: `ip` is the address KONG sees. Put Cloudflare, nginx or
                # any other proxy in front without setting Kong's trusted_ips
                # and real_ip_header and every request arrives from one address
                # — at which point this stops being per-visitor and throttles
                # everyone the moment one person is noisy.

        # Everything else GoTrue serves. Longer prefixes match first, so the
        # password grant above is taken out of this route before it is reached.
        #
        # This carries a ceiling too, but a far higher one, because the traffic
        # here is the APP rather than a visitor: Sojourn's middleware calls
        # GET /auth/v1/user to verify the session on every admin request, and
        # Next prefetches every link on the page — each prefetch being a
        # request that runs the middleware. One dashboard load was measured at
        # 26 of them inside a single second.
        #
        # Sharing the 30/minute login bucket with that locked the owner out of
        # a fresh install within seconds of signing in: getUser() started
        # answering 429, middleware read that as "no session" and redirected to
        # the login page, and the login POST was then refused by the budget the
        # prefetches had just spent. The user-visible result was "I clicked
        # something and it logged me out, and now it says API rate limit
        # exceeded". None of it was a login problem.
        #
        # /user is authenticated by a JWT the caller already holds, so it is
        # not a guessing surface. The ceiling here is only to bound a runaway
        # client — it is not the security control.
        - name: auth-v1
          url: http://auth:9999/
          routes:
            - name: auth-v1-all
              strip_path: true
              paths:
                - /auth/v1/
          plugins:
            - name: cors
            - name: rate-limiting
              config:
                minute: 600
                hour: 6000
                policy: local
                limit_by: ip
                fault_tolerant: false

        # The data API. Row-level security is what actually protects this; the
        # key only decides which Postgres role PostgREST assumes.
        - name: rest-v1
          url: http://rest:3000/
          routes:
            - name: rest-v1-all
              strip_path: true
              paths:
                - /rest/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: true
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        # Photo storage. Same story: bucket policies do the work.
        - name: storage-v1
          url: http://storage:5000/
          routes:
            - name: storage-v1-all
              strip_path: true
              paths:
                - /storage/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: true
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon
