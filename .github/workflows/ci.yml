name: CI

# Production deploys straight from `main` (Vercel ↔ GitHub), so this runs the
# same gate we'd otherwise run by hand — typecheck, tests, and a full production
# build — on every push and pull request. Make the `verify` check required on
# `main` (branch protection) to turn this from a signal into an actual gate.
#
# No secrets are needed. The build step gets placeholder Supabase config (see
# below) — this run compiles and type-checks the app, it does not produce a
# deployable artifact, and it deliberately never touches a real database.
# Lint runs here too, driving the ESLint CLI directly — `next lint` is deprecated
# and was never configured. See eslint.config.mjs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only, explicitly. Without this the token inherits whatever the repository
# default is, which for a public repo is a write-scoped token handed to every
# pull request build — including ones from forks.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches package.json "engines" and Vercel
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Placeholders, not credentials. `next build` prerenders the static pages,
      # which means it reads content — so it needs Supabase to be *configured*
      # or the app fails fast by design (SUPABASE_NOT_CONFIGURED). This used to
      # come from a committed .env.production; that file pinned one deployment's
      # project into the repo and has been removed, so CI supplies its own.
      #
      # Pointing at a host that answers nothing is the point: every read fails,
      # the content helpers return empty, and the pages still compile and
      # prerender. What that proves is that the code builds — which is all CI
      # can honestly check without a database. The output is NOT deployable:
      # the content pages are `revalidate = false`, so an empty prerender would
      # stay empty. Real builds get real credentials from the deployment.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build
