name: CI

# Production deploys straight from `main` (Vercel ↔ GitHub), so this runs the
# same gate we'd otherwise run by hand — typecheck, tests, and a full production
# build — on every push and pull request. Make the `verify` check required on
# `main` (branch protection) to turn this from a signal into an actual gate.
#
# No secrets are needed. The build step gets placeholder Supabase config (see
# below) — this run compiles and type-checks the app, it does not produce a
# deployable artifact, and it deliberately never touches a real database.
# Lint runs here too, driving the ESLint CLI directly — `next lint` is deprecated
# and was never configured. See eslint.config.mjs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only, explicitly. Without this the token inherits whatever the repository
# default is, which for a public repo is a write-scoped token handed to every
# pull request build — including ones from forks.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # matches package.json "engines" and Vercel
          cache: npm

      # Run the npm the IMAGE runs, rather than whatever setup-node happens to
      # bundle with its Node 24 patch release. Three npm 11.x releases, three
      # different answers about the same lockfile:
      #
      #   11.11  writes a lock without `@sentry/webpack-plugin`'s webpack peer
      #   11.16  installs from a lock but SKIPS the platform-matched optional
      #          dependency it needs — rolldown's linux-x64-gnu binding, so
      #          vitest 4 died on "Cannot find native binding" with 621 of 665
      #          packages installed and no error from npm itself
      #   11.17  correct on both counts; it is what node:24-alpine ships
      #
      # Pinning a literal version here would just start a new drift. Asking the
      # base image what it runs cannot drift by construction, and costs nothing:
      # the "Lockfile satisfies the image's npm" step below pulls that image
      # anyway.
      - name: Match the image's npm
        run: npm install -g "npm@$(docker run --rm node:24-alpine npm -v)"

      - name: Install dependencies
        run: npm ci

      # Belt and braces, now that the step above makes the two npms the same
      # version: this asserts it, against the actual image rather than against
      # the assumption. `@sentry/webpack-plugin` declares a non-optional
      # `peerDependencies: { webpack: ">=5.0.0" }`, and a lock written without
      # that closure passed every check here and then failed the v0.1.3 image
      # build — the one build nobody can rerun cheaply, because it is the
      # release.
      #
      # Practical consequence for anyone touching dependencies: a bare local
      # `npm install` may quietly strip the lock back down. Regenerate it inside
      # node:24-alpine (see the Dockerfile) and let this step confirm it.
      #
      # Scripts are skipped: this asks whether the lock RESOLVES, not whether
      # native modules compile.
      - name: Lockfile satisfies the image's npm
        run: docker run --rm -v "$PWD":/w -w /w node:24-alpine npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Placeholders, not credentials. `next build` prerenders the static pages,
      # which means it reads content — so it needs Supabase to be *configured*
      # or the app fails fast by design (SUPABASE_NOT_CONFIGURED). This used to
      # come from a committed .env.production; that file pinned one deployment's
      # project into the repo and has been removed, so CI supplies its own.
      #
      # Pointing at a host that answers nothing is the point: every read fails,
      # the content helpers return empty, and the pages still compile and
      # prerender. What that proves is that the code builds — which is all CI
      # can honestly check without a database. The output is NOT deployable:
      # the content pages are `revalidate = false`, so an empty prerender would
      # stay empty. Real builds get real credentials from the deployment.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build
