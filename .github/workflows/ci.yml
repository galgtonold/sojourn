name: CI

# Production deploys straight from `main` (Vercel ↔ GitHub), so this runs the
# same gate we'd otherwise run by hand — typecheck, tests, and a full production
# build — on every push and pull request. Make the `verify` check required on
# `main` (branch protection) to turn this from a signal into an actual gate.
#
# No secrets are needed. The build step gets placeholder Supabase config (see
# below) — this run compiles and type-checks the app, it does not produce a
# deployable artifact, and it deliberately never touches a real database.
# Lint runs here too, driving the ESLint CLI directly — `next lint` is deprecated
# and was never configured. See eslint.config.mjs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only, explicitly. Without this the token inherits whatever the repository
# default is, which for a public repo is a write-scoped token handed to every
# pull request build — including ones from forks.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # matches package.json "engines" and Vercel
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm ci` a second time, in the image's own base, because the step above
      # cannot speak for the environment that publishes. v0.1.3's lockfile
      # passed every check here and then failed the release image on forty-eight
      # packages "missing from lock file" — the one build nobody can rerun
      # cheaply, because it is the release.
      #
      # The cause turned out to be a missing .npmrc in the Dockerfile's COPY, so
      # only the image resolved peer dependencies strictly (see the Dockerfile).
      # That is fixed, which makes this step agree with the one above rather than
      # contradict it — and that is exactly the state worth asserting on every
      # push, since nothing about a Dockerfile edit announces that it has changed
      # how dependencies resolve.
      #
      # Scripts are skipped: this asks whether the lock RESOLVES, not whether
      # native modules compile.
      #
      # IN A COPY, never in the workspace. Mounting $PWD here — as this step did
      # when it was written — has `npm ci` delete the node_modules the step above
      # just built and replace it with an ALPINE one. The workspace then holds
      # musl binaries on a glibc runner, and the next command that wants a native
      # module dies far from the cause: vitest 4 reported "Cannot find native
      # binding" for rolldown and blamed the lockfile, which was fine. Three
      # inputs decide the answer and none of them is node_modules.
      - name: Lockfile satisfies the image's npm
        run: |
          mkdir -p "$RUNNER_TEMP/lockcheck"
          cp package.json package-lock.json .npmrc "$RUNNER_TEMP/lockcheck/"
          docker run --rm -v "$RUNNER_TEMP/lockcheck":/w -w /w \
            node:24-alpine npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Placeholders, not credentials. `next build` prerenders the static pages,
      # which means it reads content — so it needs Supabase to be *configured*
      # or the app fails fast by design (SUPABASE_NOT_CONFIGURED). This used to
      # come from a committed .env.production; that file pinned one deployment's
      # project into the repo and has been removed, so CI supplies its own.
      #
      # Pointing at a host that answers nothing is the point: every read fails,
      # the content helpers return empty, and the pages still compile and
      # prerender. What that proves is that the code builds — which is all CI
      # can honestly check without a database. The output is NOT deployable:
      # the content pages are `revalidate = false`, so an empty prerender would
      # stay empty. Real builds get real credentials from the deployment.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build

  # ── The layer `verify` cannot reach ────────────────────────────────────────
  #
  # `verify` deliberately never touches a database, which means the policies in
  # 50-odd migrations are checked by reading them. test/e2e/rls.test.ts exists
  # because that does not work — 0036 broke `select=*` and was found by hand
  # during a backup; 0043 broke `comments(count)` and every post page on the
  # live site rendered as not-found until somebody browsed to one.
  #
  # It has been in the repo, opt-in behind RLS_DATABASE_URL, and nothing set
  # that variable — so it skipped on every run and read as coverage. This is the
  # job that sets it.
  #
  # Both directions are asserted. Two of those incidents were a grant tightened
  # too far, not a leak: over-tightening has taken the public site down twice.
  rls:
    name: row-level security · real postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same generator a real install runs, so a change that breaks it
      # breaks here too rather than in somebody's first five minutes.
      - name: Generate a throwaway env
        run: node scripts/selfhost-init.mjs --stdout > .env

      # `--wait` blocks until the healthchecks pass, so nothing below races the
      # database. Only db + storage: the RLS suite talks Postgres directly and
      # has no use for the app, auth or the gateway.
      - name: Start Postgres
        run: |
          docker compose -p sojourn-rls \
            -f docker-compose.all-in-one.yml -f docker-compose.ci.yml \
            --env-file .env up -d --wait db storage

      - name: Apply migrations
        run: |
          set -a && . ./.env && set +a
          DATABASE_URL="postgres://postgres:${POSTGRES_PASSWORD}@127.0.0.1:5432/postgres" \
            node scripts/migrate.mjs

      - name: Row-level security suite
        run: |
          set -a && . ./.env && set +a
          RLS_DATABASE_URL="postgres://postgres:${POSTGRES_PASSWORD}@127.0.0.1:5432/postgres" \
            npm run test:rls

      # A suite that silently skips is the problem this job exists to fix, so
      # prove it actually ran rather than trusting a green tick.
      - name: Assert the suite did not skip
        run: |
          set -a && . ./.env && set +a
          RLS_DATABASE_URL="postgres://postgres:${POSTGRES_PASSWORD}@127.0.0.1:5432/postgres" \
            npx vitest run test/e2e/rls.test.ts --reporter=json --outputFile=rls.json
          node -e '
            const r = require("./rls.json");
            const ran = r.numPassedTests ?? 0;
            if (r.numPendingTests > 0 || ran === 0) {
              console.error(`RLS suite did not run: ${ran} passed, ${r.numPendingTests} skipped.`);
              console.error("RLS_DATABASE_URL is not reaching the database — the suite skipped and CI went green anyway.");
              process.exit(1);
            }
            console.log(`RLS suite ran ${ran} tests against real Postgres.`);
          '

      - name: Tear down
        if: always()
        run: |
          docker compose -p sojourn-rls \
            -f docker-compose.all-in-one.yml -f docker-compose.ci.yml \
            --env-file .env down -v

  # ── The whole thing, through a browser ─────────────────────────────────────
  #
  # Against the all-in-one stack, running THIS commit's image — not the last
  # published one — so a PR is tested rather than the last release.
  #
  # The journey is almost incidental. What earns this job its four minutes is
  # test/browser/harness.ts: every spec fails on a console error, an uncaught
  # exception, or any failed same-origin request, and the budget spec counts
  # what the app actually asks Supabase for. Those catch the failures this
  # project keeps having — a map that renders with no data, 45 auth round trips
  # per page load, a slug that loses a letter — none of which a happy-path
  # script notices.
  e2e:
    name: browser journey · all-in-one stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: docker/setup-buildx-action@v4

      # amd64 only, loaded into the local daemon rather than pushed. The release
      # workflow is what builds arm64; this one only needs something to drive.
      - name: Build this commit's image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/galgtonold/sojourn:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # SUPABASE_PUBLIC_URL is one value handed to both the browser and the app
      # container, and they have to agree on it. Inside the container the name
      # resolves via `extra_hosts: host-gateway`; on a Linux runner it resolves
      # nowhere, so the browser could not reach Supabase at all. Docker Desktop
      # adds this entry for you, which is why it only breaks here.
      - name: Teach the runner host.docker.internal
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - name: Start the stack
        run: node scripts/e2e-stack.mjs up --tag e2e

      - name: Browser journey
        env:
          E2E_BASE_URL: http://localhost:3801
          E2E_COMPOSE_PROJECT: sojourn-e2e
        run: npm run test:browser

      # The trace is the whole point of collecting it — a failure here is a
      # silent one by definition, so the artefact is often the only description.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose -p sojourn-e2e -f docker-compose.all-in-one.yml \
            --env-file .e2e/.env logs --tail 200 web kong auth || true

      - name: Tear down
        if: always()
        run: node scripts/e2e-stack.mjs down
