name: CI

# Production deploys straight from `main` (Vercel ↔ GitHub), so this runs the
# same gate we'd otherwise run by hand — typecheck, tests, and a full production
# build — on every push and pull request. Make the `verify` check required on
# `main` (branch protection) to turn this from a signal into an actual gate.
#
# No secrets are needed: `next build` auto-loads the committed, public-only
# `.env.production` (Supabase URL + anon key), the same config Vercel builds with.
# Lint is intentionally omitted for now — ESLint isn't configured yet (`next lint`
# is unconfigured + deprecated); wiring up the ESLint CLI is a separate follow-up.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches package.json "engines" and Vercel
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
