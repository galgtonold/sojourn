# Sojourn — local/VPS container orchestration.
#
# This runs the Next.js app as a container. For the cloud/dev phase you'll point
# it at hosted Supabase via the env vars. For a full self-hosted VPS later, you
# can add the Supabase stack here too (see README → "Moving to a VPS").
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL}
    image: sojourn:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Server-only secrets are read at runtime (not baked into the image).
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Schema migrations run at container start, before the server accepts a
      # request — see docs/adr/0002. Wants the DIRECT connection (5432), not the
      # transaction pooler. Unset means they are skipped, loudly, in the logs.
      DATABASE_URL: ${DATABASE_URL:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    env_file:
      - .env.local
