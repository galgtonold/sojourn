# Sojourn — local/VPS container orchestration.
#
# This runs the Next.js app as a container. For the cloud/dev phase you'll point
# it at hosted Supabase via the env vars. For a full self-hosted VPS later, you
# can add the Supabase stack here too (see docs/deployment.md → "Moving to a VPS later").
services:
  web:
    # Two ways to get the app, and they share this one name:
    #
    #   from the registry   docker compose pull && docker compose up -d
    #   from source         docker compose up -d --build
    #
    # The registry path is the one worth having — compiling Next wants about a
    # gigabyte of memory and takes the site down while it runs, which is a poor
    # trade on the small VPS this is most often deployed to. Published by
    # .github/workflows/publish-image.yml on every release.
    #
    # Pin harder than :latest by setting SOJOURN_TAG — 0.2, 0, or an exact
    # 0.2.1 — to choose how much change you are willing to take unattended.
    # No leading "v": the publish workflow's {{version}} pattern strips it, so
    # the registry has :0.2.1, not :v0.2.1.
    image: ghcr.io/galgtonold/sojourn:${SOJOURN_TAG:-latest}
    build:
      context: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Everything the app needs is read at RUNTIME — including the values the
    # browser sees. Nothing is baked in, so this same image runs any deployment
    # (see src/lib/public-config.ts).
    #
    # `.env.local` is passed through whole, so the NEXT_PUBLIC_* spellings you
    # already have keep working untouched. The unprefixed names below are the
    # ones to reach for when you want to point a container somewhere without
    # editing that file; blank means "not set" and falls through.
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      # Supabase's newer name for the same key. Accepted by the app, so it has
      # to be accepted here too or a project created today cannot be configured.
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SITE_URL: ${SITE_URL:-}
      SITE_NAME: ${SITE_NAME:-}
      MAP_STYLE_URL: ${MAP_STYLE_URL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      SENTRY_DSN_CLIENT: ${SENTRY_DSN_CLIENT:-}
      DEMO_MODE: ${DEMO_MODE:-}
      # Where visitors can get the source of THIS deployment (AGPL §13). Unset
      # points at upstream, which is correct until you change the code — after
      # that, setting it is an obligation rather than a preference.
      SOURCE_URL: ${SOURCE_URL:-}
      # Schema migrations run at container start, before the server accepts a
      # request — see docs/adr/0002. Wants the DIRECT connection (5432), not the
      # transaction pooler. Unset means they are skipped, loudly, in the logs.
      DATABASE_URL: ${DATABASE_URL:-}
    env_file:
      # `required: false` because a fresh clone has no .env.local — it is
      # gitignored — and Compose treats a missing env_file as a hard error.
      # Without this, the very first command in docs/deployment.md's Docker section
      # fails on a machine that has done nothing wrong. (Needs Compose ≥ 2.24.)
      - path: .env.local
        required: false
