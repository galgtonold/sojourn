# Kong routes one public URL onto the three Supabase services Sojourn uses.
#
# The `$SUPABASE_*` placeholders are substituted at container start by the
# entrypoint in docker-compose.all-in-one.yml, so this file stays free of
# secrets and can live in git. Trimmed from Supabase's own self-hosted config:
# no realtime, no analytics, no studio, no edge functions — see the compose file
# for why each of those is absent.
# Single-quoted on purpose. The entrypoint substitutes the keys with
# `eval "echo \"$(cat ...)\""`, and that eats double quotes — Kong then reads
# 2.1 as a number and refuses to start with "expected a string".
_format_version: '2.1'
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  # Auth. Sign-in, token refresh and invite acceptance are unauthenticated by
  # definition — you have no key until you have signed in — so no key-auth here.
  # Which makes this the one route where password guessing is free, and GoTrue
  # does not throttle it: v2.190.0 ships rate limits for token REFRESH, OTP,
  # verify, email and SMS, and nothing at all for the password grant. So the
  # ceiling has to live here.
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: rate-limiting
        config:
          # Generous for a person signing in, useless for a script. A session
          # refresh is roughly hourly per reader, so this is nowhere near real
          # traffic on a personal journal.
          minute: 30
          hour: 200
          # `local` keeps the counters in this Kong's own memory. Correct here
          # because the all-in-one runs exactly one Kong; a clustered deployment
          # would need the redis policy and a redis to point it at.
          policy: local
          limit_by: ip
          # Refuse rather than let it through when the counter itself breaks.
          fault_tolerant: false
          # NOTE: `ip` is the address KONG sees. Put Cloudflare, nginx or any
          # other proxy in front without setting Kong's trusted_ips and
          # real_ip_header and every request arrives from one address — at which
          # point this stops being per-visitor and throttles everyone the moment
          # one person is noisy.

  # The data API. Row-level security is what actually protects this; the key
  # only decides which Postgres role PostgREST assumes.
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  # Photo storage. Same story: bucket policies do the work.
  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
