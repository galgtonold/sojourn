<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0908" />
    <title>Offline · Sojourn</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0908;
        color: #f5f1ea;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }
      .card {
        max-width: 28rem;
      }
      h1 {
        font-size: 1.6rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
        letter-spacing: -0.01em;
      }
      p {
        color: rgba(245, 241, 234, 0.6);
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      .compass {
        font-size: 2.5rem;
        margin-bottom: 1rem;
      }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        border-radius: 9999px;
        padding: 0.65rem 1.5rem;
        font-size: 0.95rem;
        font-weight: 600;
        color: #0a0908;
        background: #f0883e;
        transition: background 0.15s ease;
      }
      button:hover {
        background: #f59e5a;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="compass">🧭</div>
        <h1>You're offline</h1>
        <p>
          This page hasn't been saved for offline reading yet. Stories and trips
          you've already opened are still available — reconnect to load anything
          new.
        </p>
        <button onclick="location.reload()">Try again</button>
      </div>
    </div>
  </body>
</html>
